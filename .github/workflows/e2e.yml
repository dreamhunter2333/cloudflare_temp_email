name: End-to-End Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run unit tests
        working-directory: e2e
        run: |
          npm ci
          npm run test:unit
      - name: Run frontend unit tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  e2e-groups:
    name: E2E ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [api, browser, webhook, smtp-proxy]
    env:
      COMPOSE_PROFILES: ${{ matrix.project }}
      PLAYWRIGHT_PROJECT: ${{ matrix.project }}
      COMPOSE_FILE: ${{ (matrix.project == 'browser' || matrix.project == 'webhook') && 'docker-compose.yml:compose.ci.yml' || 'docker-compose.yml' }}
      PLAYWRIGHT_WORKERS: ${{ (matrix.project == 'browser' || matrix.project == 'webhook') && '75%' || '1' }}
      RUN_UNIT_TESTS: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        if: matrix.project == 'browser' || matrix.project == 'webhook'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        if: matrix.project == 'browser' || matrix.project == 'webhook'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: matrix.project == 'browser' || matrix.project == 'webhook'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build E2E images
        working-directory: e2e
        run: docker compose build

      - name: Run E2E tests
        working-directory: e2e
        run: docker compose up --no-build --abort-on-container-exit --exit-code-from e2e-runner

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          cd e2e
          docker compose down -v

  e2e:
    if: always()
    needs: [unit, e2e-groups]
    runs-on: ubuntu-latest
    steps:
      - name: Check all test groups passed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          GROUPS_RESULT: ${{ needs.e2e-groups.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$GROUPS_RESULT" = success
